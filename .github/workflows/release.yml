name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-36 build-tools;36.0.0

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 -d > keystore/aura-release.jks

      - name: Write keystore.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          printf 'storeFile=keystore/aura-release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties

      - name: Make gradlew executable
        run: chmod +x gradlew

      # local.properties is gitignored, so without this step the published APK would carry an empty
      # POSTHOG_PROJECT_TOKEN: no event could ever be sent, while the consent screen still asks the
      # user to share them. A warning rather than a failure — the app works without analytics.
      - name: Write the analytics token into local.properties
        env:
          POSTHOG_PROJECT_TOKEN: ${{ secrets.POSTHOG_PROJECT_TOKEN }}
        run: |
          if [ -z "$POSTHOG_PROJECT_TOKEN" ]; then
            echo "::warning::POSTHOG_PROJECT_TOKEN is not set: this APK will ship with usage analytics permanently disabled, while the consent screen still offers to share them."
          fi
          printf 'POSTHOG_PROJECT_TOKEN=%s\n' "$POSTHOG_PROJECT_TOKEN" > local.properties

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --console=plain

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
